deployment:
  tasks:
    - export DEPLOYPATH=/home/kopw7369/kopkarskf/
    - /bin/cp -R app $DEPLOYPATH
    - /bin/cp -R bootstrap $DEPLOYPATH
    - /bin/cp -R config $DEPLOYPATH
    - /bin/cp -R database $DEPLOYPATH
    - /bin/cp -R lang $DEPLOYPATH
    - /bin/cp -R resources $DEPLOYPATH
    - /bin/cp -R routes $DEPLOYPATH
    - /bin/cp artisan $DEPLOYPATH
    - /bin/cp composer.json $DEPLOYPATH
    - /bin/cp composer.lock $DEPLOYPATH
    - export PUBLICPATH=/home/kopw7369/public_html/
    - /bin/cp -R public/* $PUBLICPATH
    # Fix paths in public_html/index.php to point to kopkarskf
    - /bin/sed -i "s|/../storage|/../kopkarskf/storage|g" $PUBLICPATH/index.php
    - /bin/sed -i "s|/../vendor|/../kopkarskf/vendor|g" $PUBLICPATH/index.php
    - /bin/sed -i "s|/../bootstrap|/../kopkarskf/bootstrap|g" $PUBLICPATH/index.php
